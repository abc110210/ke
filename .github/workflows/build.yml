# ============================================================================
# CI：windows-latest 上完成 编译 -> 打包 -> 运行验证 -> 产出工件
# 私有仓库内运行，环境受控（GitHub 托管 runner）。
# ============================================================================
name: build-and-verify

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 MSVC 工具链
        uses: ilammy/msvc-dev-cmd@v1

      - name: 一键构建（打包器 -> 加密负载 -> 嵌入壳）
        shell: pwsh
        run: |
          # CI runner 以管理员运行：给工作目录加 Defender 排除 + 关闭实时扫描，
          # 避免实时扫描干预加壳产物（packed_app.exe 带 syscall/反调试特征易被盯上）
          try { Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -Force } catch { Write-Host "Add-MpPreference 失败: $_" }
          try { Set-MpPreference -DisableRealtimeMonitoring $true -Force } catch { Write-Host "Set-MpPreference 失败: $_" }
          Write-Host "Defender 排除+实时扫描已关闭: $env:GITHUB_WORKSPACE"

          # CI 137：在 build.ps1 之前，先从 client/ 源码编译 HanbotSavesUploader.exe。
          # build.ps1 只从 test/ 拿预编译 exe——如果不同步 client 源码编译，
          # CMakeLists.txt 的编译选项改动（去 /GL /LTCG /GUARD:CF）不会生效。
          $clientDir = "client"
          if (Test-Path "$clientDir/CMakeLists.txt") {
            Write-Host "[CI 137] 从 client/ 源码编译 HanbotSavesUploader.exe..."
            $clientBuild = "build/client"
            # 递归查找 WebView2 SDK（优先用仓库内已提交的 SDK 文件）
            $wv2h = Get-ChildItem . -Recurse -Filter "WebView2.h" -ErrorAction SilentlyContinue | Select-Object -First 1
            $wv2l = Get-ChildItem . -Recurse -Filter "WebView2LoaderStatic.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
            # 仓库里没有 → 从 NuGet 下载微软官方包 Microsoft.Web.WebView2（不带版本号=取最新稳定版，
            # 布局 build/native/include + build/native/x64，与 CMakeLists 默认路径一致）
            if (-not $wv2h -or -not $wv2l) {
              Write-Host "[CI 137] 未找到已提交的 WebView2 SDK，从 NuGet 下载 Microsoft.Web.WebView2..."
              $wv2zip = "$env:TEMP\wv2.zip"
              try {
                Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2" -OutFile $wv2zip -UseBasicParsing
                Expand-Archive $wv2zip -DestinationPath "webview2sdk" -Force
                $wv2h = Get-ChildItem "webview2sdk" -Recurse -Filter "WebView2.h" -ErrorAction SilentlyContinue | Select-Object -First 1
                $wv2l = Get-ChildItem "webview2sdk" -Recurse -Filter "WebView2LoaderStatic.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
              } catch { Write-Host "  NuGet 下载失败: $_" }
            }
            if ($wv2h) { $env:WEBVIEW2_INCLUDE_DIR = $wv2h.DirectoryName; Write-Host "  WEBVIEW2_INCLUDE_DIR=$($wv2h.DirectoryName)" }
            if ($wv2l) { $env:WEBVIEW2_LIB_DIR = $wv2l.DirectoryName; Write-Host "  WEBVIEW2_LIB_DIR=$($wv2l.DirectoryName)" }
            if (-not $wv2h -or -not $wv2l) {
              Write-Host "[CI 137] WebView2 SDK 获取失败，跳过 client 编译，用 test/ 下已有 exe" -ForegroundColor Yellow
            } else {
              & cmake -S $clientDir -B $clientBuild -A x64 2>&1 | Write-Host
              if ($LASTEXITCODE -eq 0) {
                & cmake --build $clientBuild --config Release --parallel 2>&1 | Write-Host
                if ($LASTEXITCODE -eq 0) {
                  $clientExe = "$clientBuild/Release/HanbotSavesUploader.exe"
                  if (Test-Path $clientExe) {
                    Copy-Item $clientExe "test/HanbotSavesUploader.exe" -Force
                    $sz = (Get-Item "test/HanbotSavesUploader.exe").Length
                    Write-Host "[CI 137] client 编译成功！已覆盖 test/HanbotSavesUploader.exe ($sz 字节)" -ForegroundColor Green
                  }
                } else {
                  Write-Host "[CI 137] client 编译失败，用 test/ 下已有 exe" -ForegroundColor Yellow
                }
              } else {
                Write-Host "[CI 137] client cmake configure 失败，用 test/ 下已有 exe" -ForegroundColor Yellow
              }
            }
          }

          .\build.ps1

      - name: 运行加壳后的程序（隔离实验：5 个保护组合自动对比）
        shell: pwsh
        run: |
          # 产物名带目标主名（build.ps1 输出，如 HanbotSavesUploader_packed.exe），用 glob 定位
          $packed = Get-ChildItem ".\*_packed.exe" -File -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          if (-not $packed) { throw "未找到加壳产物 *_packed.exe（build 步骤可能失败）" }
          $out = $packed.FullName
          Write-Host "加壳产物: $out"
          # 加壳成功的最直接证据：产物末尾必须带 overlay Footer（magic "PEARMOROV"）。
          # 若无 → packer 没把密文拼进去（裸 stub），运行必然报「未发现 overlay」。
          # Footer 大小 = sizeof(Overlay::Footer)（CI 74 起含 origFileName，为 200 字节）。
          $footerSize = 200
          $fs = [System.IO.File]::OpenRead((Resolve-Path $out))
          $fs.Seek(-$footerSize, [System.IO.SeekOrigin]::End) | Out-Null
          $buf = New-Object byte[] 8
          $fs.Read($buf, 0, 8) | Out-Null
          $fs.Close()
          $magic = [System.BitConverter]::ToUInt64($buf, 0)
          if ($magic -ne 0x564F524F4D524145) {
            throw "加壳产物缺少 overlay Footer（magic=0x{0:X16}）：$out 未成功拼接密文" -f $magic
          }
          Write-Host "overlay Footer 校验通过（密文已拼接），产物大小: $((Get-Item $out).Length) 字节"
          $env:PEARMOR_DEBUG = "1"   # 开启壳内调试日志
          $env:PEARMOR_ALLOW_VM = "1"  # CI runner 本身是 Azure VM 且系统盘<30GB，放行 VM 检测
          $env:PEARMOR_ALLOW_CODEGEN = "1"  # 第四轮.txt 发现：CI runner 更新后 NtAllocateVirtualMemory SSN 错位(0xC0000024)，
                                           # P3.1 自校验 alloc 失败自毁；跳过 P3.1 以验证「手动加载+解密+OEP」主体流程（见 syscall.h 回退修复）
          # CI 61/62 已验证 CorruptHeader 与崩溃无关（跳过/不跳过日志逐字节一致），恢复完整保护。
          # $env:PEARMOR_NO_CORRUPT_HEADER = "1"  # 隔离诊断用，已移除

          # ============================================================
          # 隔离实验矩阵（2026-08-06）：
          #   baseline 全开预期崩（复现问题）；all-off 纯加载模式验证"加载/解密/导入"
          #   本身是否健康；gating/watchdog/inject 逐个单独关闭，定位冲突机制。
          #   GUI 程序正常表现为"常驻不退出"（消息循环），崩溃为"秒退+exit code 非0
          #   或 [veh] C++ 异常日志"。故判定：20s 超时=存活(GOOD)，提前退出=崩(BAD)。
          # ============================================================
          # 临时精简为单组合：全关保护（all_off）跑最快的"加载/解密/导入/CRT 启动"路径，
          # 配合 OepExceptFilter 新增的「崩溃所属节 + rbx vector 头」诊断，下一轮日志直接
          # 指向下一轮修复方向。定位清楚后再恢复完整矩阵。
          $combos = @(
            @{ name = "2_all_off";         gating = "1";    watchdog = "1";   inject = "1"; tls = $null; swallow = $null; fixedbase = $null }
          )
          $tmp = $env:TEMP
          $anyGood = $false
          foreach ($c in $combos) {
            Write-Host "`n========== 组合 $($c.name) ==========" -ForegroundColor Cyan
            # 清除上次 stub 日志，避免误读旧数据
            Remove-Item "$tmp\pearmor_stub.log" -ErrorAction SilentlyContinue
            Remove-Item "$tmp\pearmor_crash.log" -ErrorAction SilentlyContinue
            $env:PEARMOR_DISABLE_GATING      = if ($c.gating)   { "1" } else { $null }
            $env:PEARMOR_DISABLE_WATCHDOG    = if ($c.watchdog) { "1" } else { $null }
            $env:PEARMOR_DISABLE_INJECT_BLOCK = if ($c.inject)  { "1" } else { $null }
            $env:PEARMOR_DISABLE_TLS         = if ($c.tls)      { "1" } else { $null }
            $env:PEARMOR_SWALLOW_E06D7363    = if ($c.swallow)  { "1" } else { $null }
            $env:PEARMOR_FIXED_BASE          = if ($c.fixedbase){ "1" } else { $null }
            $env:PEARMOR_DISABLE_FAKEAV_SWALLOW = if ($c.fakeav){ "1" } else { $null }
            $env:PEARMOR_NO_CORRUPT_HEADER     = if ($c.corrupt){ "1" } else { $null }
            Write-Host "env: GATING=$env:PEARMOR_DISABLE_GATING WATCHDOG=$env:PEARMOR_DISABLE_WATCHDOG INJECT=$env:PEARMOR_DISABLE_INJECT_BLOCK TLS=$env:PEARMOR_DISABLE_TLS SWALLOW=$env:PEARMOR_SWALLOW_E06D7363 FIXEDBASE=$env:PEARMOR_FIXED_BASE NOFAKEAV=$env:PEARMOR_DISABLE_FAKEAV_SWALLOW NOCORRUPT=$env:PEARMOR_NO_CORRUPT_HEADER"
            $timeoutSec = 20
            $errFile = "stderr_$($c.name).txt"
            Remove-Item $errFile -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $out -PassThru -RedirectStandardError $errFile
            if (-not $p.WaitForExit($timeoutSec * 1000)) {
              Write-Host "[$($c.name)] ${timeoutSec}s 内未退出 -> 存活(疑似正常)，强制结束"
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              $anyGood = $true
            } else {
              Write-Host "[$($c.name)] exit_code = $($p.ExitCode)"
            }
            foreach ($lf in @("$tmp\pearmor_stub.log", "$tmp\pearmor_crash.log", $errFile)) {
              if (Test-Path $lf) {
                # CI 诊断阶段：打印【全部】日志行，不再按关键字过滤。
                # 否则新探针（[stub] ENTER / 跳OEP前 / TEB 栈 / [oep] 崩溃点机器码 / 崩溃在 payload 内偏移）
                # 会被旧过滤器吃掉，导致"秒崩无日志"假象（如 CI 110 第三轮.txt）。
                Write-Host "---- $lf (全文) ----"
                Get-Content $lf -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
                Write-Host "----------------------"
              }
            }
          }
          # 恢复默认（后续步骤不受影响）
          Remove-Item Env:PEARMOR_DISABLE_GATING -ErrorAction SilentlyContinue
          Remove-Item Env:PEARMOR_DISABLE_WATCHDOG -ErrorAction SilentlyContinue
          Remove-Item Env:PEARMOR_DISABLE_INJECT_BLOCK -ErrorAction SilentlyContinue
          Remove-Item Env:PEARMOR_DISABLE_TLS -ErrorAction SilentlyContinue
          Remove-Item Env:PEARMOR_SWALLOW_E06D7363 -ErrorAction SilentlyContinue
          Remove-Item Env:PEARMOR_FIXED_BASE -ErrorAction SilentlyContinue
          Remove-Item Env:PEARMOR_DISABLE_FAKEAV_SWALLOW -ErrorAction SilentlyContinue
          Remove-Item Env:PEARMOR_NO_CORRUPT_HEADER -ErrorAction SilentlyContinue
          Remove-Item Env:PEARMOR_ALLOW_CODEGEN -ErrorAction SilentlyContinue

          # 用户目标模式（test/ 有用户放入的 exe）：加壳成功即达标，运行结果仅作诊断
          # （真实程序的退出码/行为各异，不能按样例标准断言）
          $userMode = (Get-ChildItem ".\test" -Filter *.exe -File -ErrorAction SilentlyContinue).Count -gt 0
          if ($userMode) {
            if ($anyGood) {
              Write-Host "`n>>> 隔离实验发现：存在可正常运行的组合（all_off 或部分关闭），可据此定位冲突机制"
            } else {
              Write-Host "`n>>> 隔离实验：所有组合均崩溃 -> 问题在加载/解密/导入重建本身，与保护机制无关"
            }
          } else {
            # 样例模式：严格回归（样例程序成功执行会写验证文件）
            if ($p.ExitCode -ne 0) { throw "样例退出码非 0 ($($p.ExitCode))" }
            if (-not (Test-Path ".\pearmor_payload_ran.txt")) { throw "样例未生成验证文件：OEP 未执行" }
            Get-Content ".\pearmor_payload_ran.txt"
          }

      - name: 上传工件（加壳后的 EXE + 打包器 + 壳运行时）
        uses: actions/upload-artifact@v4
        with:
          name: pearmor-artifacts
          # 目标名_packed.exe：加壳成品（用户下载后直接运行验证）
          # pearmor-packer.exe：加壳器（对任意 exe 加壳）
          # pearmor-stub.exe：负载无关的壳运行时模板（packer 默认同目录自动找它）
          # 三者放同一目录后，本地运行 `pearmor-packer <任意程序.exe>` 即可一键加壳，
          # 无需本地 MSVC。注意路径是 build/Release/（非 build/packer/Release/，曾写错导致漏传）。
          path: |
            *_packed.exe
            build/Release/pearmor-packer.exe
            build/Release/pearmor-stub.exe
          if-no-files-found: error
