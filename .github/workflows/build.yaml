# ============================================================================
# CI：windows-latest 上完成 编译 -> 打包 -> 运行验证 -> 产出工件
# 私有仓库内运行，环境受控（GitHub 托管 runner）。
# ============================================================================
name: build-and-verify

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 MSVC 工具链
        uses: ilammy/msvc-dev-cmd@v1

      - name: 一键构建（打包器 -> 加密负载 -> 嵌入壳）
        shell: pwsh
        run: |
          .\build.ps1

      - name: 运行加壳后的程序（验证解密 + 手动加载 + OEP）
        shell: pwsh
        run: |
          $out = ".\packed_app.exe"
          if (-not (Test-Path $out)) { throw "未找到 $out" }
          $p = Start-Process -FilePath $out -PassThru -Wait
          Write-Host "exit_code = $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "加壳程序退出码非 0 ($($p.ExitCode))" }
          # 样例程序成功执行会写验证文件
          if (-not (Test-Path ".\pearmor_payload_ran.txt")) { throw "样例未生成验证文件：OEP 未执行" }
          Get-Content ".\pearmor_payload_ran.txt"

      - name: 上传工件（加壳后的 EXE + 打包器）
        uses: actions/upload-artifact@v4
        with:
          name: pearmor-artifacts
          path: |
            packed_app.exe
            build/packer/Release/pearmor-packer.exe
          if-no-files-found: error
