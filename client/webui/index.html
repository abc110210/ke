<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hanbot缓存存储器</title>
<style>
  :root{
    --bg1:#fdf4f9; --bg2:#eef3ff; --bg3:#f6f0ff;
    --ink:#34243f; --ink-soft:#6f6480; --ink-faint:#9b90ab;
    --line:#ece4f1; --card:#ffffff;
    --rose:#ff7eb3; --rose-deep:#ff5e9c;
    --peri:#7aa6ff; --peri-deep:#5b86f0;
    --ok:#2bb673; --warn:#e5547a;
    --grad-rose:linear-gradient(135deg,#ff9ec2 0%,#ff6ea8 100%);
    --grad-peri:linear-gradient(135deg,#9db8ff 0%,#6f8cf2 100%);
    --grad-twin:linear-gradient(120deg,#ff8fc0 0%,#b79bff 50%,#8fb0ff 100%);
    --shadow:0 30px 80px rgba(90,70,130,.28),0 8px 24px rgba(90,70,130,.16);
    --font:"Segoe UI","Microsoft YaHei UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,-apple-system,sans-serif;
  }
  /* 关键：整页不滚动、禁橡皮筋回弹、禁文本选择高亮 —— 这些是“网页感”的来源 */
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    font-family:var(--font);color:var(--ink);
    display:flex;align-items:center;justify-content:center;padding:28px;
    background:
      radial-gradient(700px 600px at 80% -10%, rgba(255,158,194,.22), transparent 60%),
      radial-gradient(700px 600px at 0% 110%, rgba(123,166,255,.22), transparent 60%),
      linear-gradient(160deg,#e9e3f1,#dde6f4 60%,#e6e0f2);
    -webkit-user-select:none;user-select:none;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
  }
  img{-webkit-user-drag:none}

  /* ===== 应用窗口（WebView2 将铺满此区域）===== */
  .window{
    width:720px;max-width:100%;height:840px;max-height:94vh;
    display:flex;flex-direction:column;
    background:linear-gradient(180deg,#ffffff 0%,#fbf7ff 100%);
    border:1px solid rgba(180,160,210,.35);border-radius:16px;overflow:hidden;
    box-shadow:var(--shadow);
  }
  /* 真实窗口（WebView2）里：原生窗口自己有圆角和投影，页面必须整屏铺满。
     否则外面这圈 28px 留白 + 圆角边框会白白吃掉约 56px 高度，
     下半部被挤压后就会出现「密码区和操作结果叠在一起」。 */
  body.native{padding:0;background:#fff}
  body.native .window{
    width:100%;max-width:none;height:100%;max-height:none;
    border:none;border-radius:0;box-shadow:none;
  }

  /* 标题栏（窗口控制） */
  .titlebar{
    height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:0 14px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);position:relative;
  }
  .titlebar .left{display:flex;align-items:center;gap:10px}
  .titlebar .mark{
    width:30px;height:30px;border-radius:9px;background:var(--grad-twin);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;
    box-shadow:0 5px 14px rgba(150,110,200,.35);overflow:hidden;position:relative;
  }
  .titlebar .mark img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
  .titlebar .title{font-weight:700;font-size:14.5px;letter-spacing:.4px}
  .titlebar .sub{font-size:11px;color:var(--ink-faint);font-weight:600}
  .winctrl{display:flex;gap:8px}
  .winctrl button{
    width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;
    color:var(--ink-soft);cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.16s;
  }
  .winctrl button:hover{border-color:var(--rose);color:var(--rose-deep)}
  .winctrl .close:hover{background:#ffe1ea;border-color:var(--warn);color:var(--warn)}
  .accent{height:3px;flex:none;background:var(--grad-twin)}

  /* 窗口主体：外层不滚动，仅日志区内部滚动 */
  .body{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px 18px;position:relative;overflow:hidden}
  .body::before{content:"";position:absolute;top:-40px;right:-30px;width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,158,194,.14),transparent 70%);pointer-events:none}
  .body::after{content:"";position:absolute;bottom:-30px;left:-30px;width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle,rgba(123,166,255,.14),transparent 70%);pointer-events:none}

  /* 上半部固定不压缩：窗口变矮时只允许日志区收缩，其它控件一律保持原尺寸，
     这样永远不会出现两块内容重叠。 */
  .top{flex:none;position:relative;z-index:1}

  /* 连接状态（紧凑药丸） */
  .connrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .conn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;
        background:#f6f2fb;padding:7px 14px;border-radius:999px;border:1px solid var(--line)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ink-faint);box-shadow:0 0 0 4px rgba(155,144,171,.16);transition:.3s}
  .conn.ok .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(43,182,117,.2)}
  .conn.err .dot{background:var(--warn);box-shadow:0 0 0 4px rgba(229,84,122,.2)}
  .conn.ok{color:var(--ok)} .conn.err{color:var(--warn)} .conn.wait{color:var(--ink-soft)}
  .retry{border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-weight:600;font-size:12px;
         padding:6px 13px;border-radius:999px;cursor:pointer;transition:.16s}
  .retry:hover{border-color:var(--rose);color:var(--rose-deep)}

  .label{font-size:13px;font-weight:700;color:var(--ink);margin:12px 0 6px;letter-spacing:.3px;position:relative;z-index:1}
  .label:first-of-type{margin-top:0}
  .row{display:flex;gap:9px;position:relative;z-index:1}
  .input{flex:1;height:42px;border:1.5px solid var(--line);border-radius:12px;background:#fcfbff;
         padding:0 14px;font-size:14px;color:var(--ink);outline:none;transition:.16s;font-family:var(--font);
         -webkit-user-select:text;user-select:text}
  .input::placeholder{color:var(--ink-faint)}
  .input:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(255,126,179,.14);background:#fff}
  .btn{flex:none;height:42px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);
       background:#fff;color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;transition:.16s;font-family:var(--font)}
  .btn:hover{border-color:var(--peri);color:var(--peri-deep);transform:translateY(-1px)}

  .verify{margin-top:6px;font-size:12.5px;font-weight:600;color:var(--ink-soft);position:relative;z-index:1}
  .verify.ok{color:var(--ok)} .verify.err{color:var(--warn)}

  .pwd{flex:1;min-width:0;height:42px;border:1.5px solid var(--line);border-radius:12px;background:#fcfbff;
       padding:0 14px;font-size:14px;color:var(--ink);outline:none;letter-spacing:3px;transition:.16s;font-family:var(--font);position:relative;z-index:1;
       -webkit-user-select:text;user-select:text;-webkit-text-security:disc}
  .pwd:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(255,126,179,.14);background:#fff}
  .pwd.visible{letter-spacing:1px;-webkit-text-security:none}   /* 明文显示时收紧字距 + 取消 CSS 遮罩 */
  .pwd-eye{width:42px;padding:0;display:flex;align-items:center;justify-content:center}
  .pwd-eye svg{width:18px;height:18px;display:none;fill:none;stroke:var(--ink-soft);stroke-width:1.6;
               stroke-linecap:round;stroke-linejoin:round;transition:.16s}
  .pwd-eye svg.eye-open{display:block}
  .pwd-eye:hover svg{stroke:var(--peri-deep)}
  .pwd-eye.on svg.eye-open{display:none}
  .pwd-eye.on svg.eye-closed{display:block}
  .pwd-eye.on svg{stroke:var(--peri-deep)}
  .hint{margin-top:6px;font-size:12px;color:var(--ink-soft);line-height:1.6;position:relative;z-index:1}
  .hint.ok{color:var(--ok)} .hint.err{color:var(--warn)}

  .actions{display:flex;gap:12px;margin-top:12px;position:relative;z-index:1}
  .primary{flex:1;height:46px;border:none;border-radius:14px;color:#fff;font-weight:800;font-size:15px;letter-spacing:.5px;
           cursor:pointer;transition:.2s;box-shadow:0 12px 26px rgba(150,110,200,.28);font-family:var(--font);position:relative;z-index:1}
  .primary:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
  .up{background:var(--grad-rose)} .up:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(255,94,156,.36)}
  .down{background:var(--grad-peri)} .down:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(91,134,240,.34)}

  .progress{height:9px;border-radius:999px;background:#efe8f6;overflow:hidden;margin-top:12px;position:relative;z-index:1}
  .bar{height:100%;width:0%;border-radius:999px;background:var(--grad-twin);transition:width .35s ease}
  .stage{font-size:12px;color:var(--ink-soft);margin-top:6px;font-weight:600;position:relative;z-index:1}

  /* 下半部：日志可伸缩，结果/页脚固定；overflow:hidden 保证任何情况下都是「裁掉」而不是「叠上去」 */
  .lower{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:10px;position:relative;z-index:1;overflow:hidden}
  .logpanel{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .logpanel .label{margin-top:0}
  .panel{flex:none;position:relative;z-index:1}
  .panel > .label{margin:12px 0 6px}
  /* 结果框：边框放在外层 wrapper 上，textarea 去自身边框。
     这样可彻底避免 Chromium/WebView2 下滚动内容把底部边框裁掉、出现“底边缺失”的观感；
     聚焦高亮也移到 wrapper 上（:focus-within），边框始终完整可见。 */
  .result-wrap{width:100%;border:1.5px solid var(--line);border-radius:12px;background:#fcfbff;
       overflow:hidden;transition:.16s}
  .result-wrap:focus-within{border-color:var(--peri);background:#fff}
  .res-actions{display:flex;justify-content:flex-end;margin-top:6px}
  /* 复制结果按钮：加高并加淡紫背景，避免白底浅边框在浅色卡片上「隐形」 */
  .btn.copy{height:38px;padding:0 16px;font-size:13px;border-radius:10px;
            background:#f7f4ff;border-color:#d8cef0;color:#5a4a7a}
  .btn.copy:hover{background:#ede8ff;border-color:#b9ace0;color:#4a3a6a}
  .box{width:100%;border:1.5px solid var(--line);border-radius:12px;background:#fcfbff;color:var(--ink);
       font:12px/1.65 "Cascadia Mono",Consolas,monospace;padding:11px 13px;resize:none;outline:none;
       -webkit-user-select:text;user-select:text}
  .box:focus{border-color:var(--peri);background:#fff}
  /* 细的、贴近系统风格的滚动条（日志/结果内部）。
     关键：用 ::-webkit-scrollbar-button{display:none} 干掉 Chromium/WebView2 默认
     出现在滚动条上下的「三角形箭头」——那两个箭头在窄滚动条上特别丑，
     用户明确要去掉。thumb 用细圆角 + 留白内边距，观感干净。
     选择器同时包含 .box（含 .result）和独立的 .log。
     2026-08-06 深究：WebView2 在 Windows 默认渲染用【系统滚动条】，::-webkit-scrollbar
     伪元素在系统模式下不生效；必须在 ::-webkit-scrollbar 顶层加 -webkit-appearance:none
     强制走 Chromium custom 渲染，::-webkit-scrollbar-button 的 display:none 才能生效。
     05:51 的 !important + appearance:none 单独加在 button 上还不够——必须整个
     滚动条都 custom 渲染。 */
  .box,.log{scrollbar-width:thin;scrollbar-color:#d4c4e6 transparent}
  .box::-webkit-scrollbar,.log::-webkit-scrollbar{width:8px;height:8px;-webkit-appearance:none}
  .box::-webkit-scrollbar-button,.log::-webkit-scrollbar-button{display:none !important;width:0;height:0;-webkit-appearance:none}
  .box::-webkit-scrollbar-thumb,.log::-webkit-scrollbar-thumb{background:#d4c4e6;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  .box::-webkit-scrollbar-thumb:hover,.log::-webkit-scrollbar-thumb:hover{background:#bda8dd}
  .box::-webkit-scrollbar-track,.log::-webkit-scrollbar-track{background:transparent}
  /* 日志区是唯一可伸缩区域：弹性铺满下半部剩余空间，最小高度 96px（约 4 行）。
     窗口被拉高时日志随之变长；只有日志特别长才内部滚动（且已无三角箭头）。 */
  .log{flex:1 1 auto;min-height:96px;overflow:auto;white-space:pre-wrap}
  /* 结果框：典型「请记好以下信息 + 上传密码 + 取回密码」3 行约 63px，
     把 max-height 放宽到 120px，正常情况下绝不出现滚动条；仅极长内容才滚动（且已无箭头）。 */
  .result{flex:none;min-height:52px;height:auto;max-height:120px;overflow:auto;
          border:none;border-radius:0;background:transparent;width:100%}

  .footer{flex:none;margin-top:8px;font-size:11.5px;color:var(--ink-faint);line-height:1.6;position:relative;z-index:1}

  /* 预览调试条（仅用于确认状态，真实窗口无此条） */
  .debug{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
  .debug button{border:1px dashed #d9c6ec;background:#fff;color:#8a6fae;font-size:11.5px;font-weight:600;
                 padding:6px 11px;border-radius:9px;cursor:pointer;transition:.16s;font-family:var(--font)}
  .debug button:hover{background:#f6eeff;border-color:var(--rose)}

  @media(max-width:560px){ .actions{flex-direction:column} }

  /* 矮屏 / 高 DPI 缩放下整体收紧一档，保证「操作结果」和页脚仍在可视范围内 */
  @media(max-height:620px){
    .connrow{margin-bottom:10px}
    .label{margin:11px 0 6px}
    .verify,.hint{margin-top:6px}
    .actions{margin-top:12px}
    .primary{height:46px;font-size:14px}
    .progress{margin-top:12px}
    .stage{margin-top:6px}
    .lower{margin-top:10px}
    .log{min-height:80px}
    .result{height:52px}
    .footer{margin-top:8px;font-size:11px}
  }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="left">
        <div class="mark" id="mark"><span id="markText">H</span><img id="appIcon" alt=""></div>
        <div>
          <div class="title">Hanbot 缓存存储器</div>
          <div class="sub">SAVE UPLOADER · v1.0.0</div>
        </div>
      </div>
      <div class="winctrl">
        <button title="最小化">—</button>
        <button class="close" title="关闭">×</button>
      </div>
    </div>
    <div class="accent"></div>

    <div class="body">
      <div class="top">
        <div class="connrow">
          <div class="conn wait" id="conn"><span class="dot"></span><span id="connText">服务器连接：检测中…</span></div>
          <button class="retry" id="retry">重新检测</button>
        </div>

        <div class="label">HanBot 目录</div>
        <div class="row">
          <input class="input" id="path" placeholder="例如 D:\Games\League of Legends\saves">
          <button class="btn" id="detect">自动检测</button>
          <button class="btn" id="browse">手动选择</button>
        </div>
        <div class="verify" id="verify">尚未选择目录</div>

        <div class="label">上传密码（4–24 位字母 / 数字）</div>
        <div class="row">
          <input class="pwd" id="pwd" type="text" autocomplete="off" placeholder="用于加密并上传存档" maxlength="24">
          <button class="btn pwd-eye" id="togglePwd" type="button" title="显示密码" aria-label="显示密码">
            <svg viewBox="0 0 16 16" class="eye-open"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5S1 8 1 8z"/><circle cx="8" cy="8" r="2.2"/></svg>
            <svg viewBox="0 0 16 16" class="eye-closed"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5S1 8 1 8z"/><circle cx="8" cy="8" r="2.2"/><line x1="2.5" y1="13.5" x2="13.5" y2="2.5"/></svg>
          </button>
          <button class="btn" id="copyPwd">复制</button>
          <button class="btn" id="genPwd">随机生成</button>
        </div>
        <div class="hint" id="hint">请输入 4~24 位字母或数字（不能含 SK- 前缀，那是取回密码专用）；同一上传密码再次上传会覆盖原存档</div>

        <div class="label">取回密码（SK- 开头，共 23 位）</div>
        <div class="row">
          <input class="pwd" id="dlpwd" type="text" autocomplete="off" placeholder="粘贴好友分享的取回密码" maxlength="23">
          <button class="btn pwd-eye" id="toggleDlPwd" type="button" title="显示密码" aria-label="显示密码">
            <svg viewBox="0 0 16 16" class="eye-open"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5S1 8 1 8z"/><circle cx="8" cy="8" r="2.2"/></svg>
            <svg viewBox="0 0 16 16" class="eye-closed"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5S1 8 1 8z"/><circle cx="8" cy="8" r="2.2"/><line x1="2.5" y1="13.5" x2="13.5" y2="2.5"/></svg>
          </button>
        </div>
        <div class="hint" id="dlhint">上传成功后，取回密码会显示在下方「操作结果」框；把它发给好友，对方即可取回你的存档</div>

        <div class="actions">
          <button class="primary up" id="upload" disabled>📤 打包并上传</button>
          <button class="primary down" id="download" disabled>📥 下载并解压</button>
        </div>

        <div class="progress"><div class="bar" id="bar"></div></div>
        <div class="stage" id="stage">就绪</div>
      </div>

      <div class="lower">
        <div class="logpanel panel">
          <div class="label">运行日志</div>
          <textarea class="box log" id="log" readonly></textarea>
        </div>

        <div class="panel">
          <div class="label" id="resLabel">操作结果</div>
          <div class="result-wrap">
            <textarea class="box result" id="result" rows="3" readonly placeholder="操作完成后这里显示结果"></textarea>
          </div>
          <div class="res-actions"><button class="btn copy" id="copy" disabled>复制结果</button></div>
        </div>

        <div class="debug">
          <button id="simConn">模拟：连接成功 / 失败</button>
          <button id="simDir">模拟：选择有效 saves 目录</button>
          <button id="simClear">清空目录</button>
        </div>
      </div>
    </div>
  </div>

<script>
  const $ = id => document.getElementById(id);
  const log = t => { const d=new Date(), p = x => String(x).padStart(2,'0');
    const el = $('log'); el.value += '[' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + '] ' + t + '\n';
    el.scrollTop = el.scrollHeight; };

  // 是否运行在 WebView2 里（有 window.chrome.webview 即为真实窗口）
  const inWebView = !!(window.chrome && window.chrome.webview);

  let state = { dir:'', dirValid:false, connOk:false, busy:false };
  const validPwd = v => /^[A-Za-z0-9]{4,24}$/.test(v);
  const validDlPwd = v => /^SK-[A-Za-z0-9]{20}$/i.test(v);   // 取回密码：SK- + 20 位字母数字，大小写均可，共 23 位

  // 随机密码字符表（不含易混淆字符）
  const PWD_ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  const DEFAULT_HINT = '请输入 4~24 位字母或数字（不能含 SK- 前缀，那是取回密码专用）；同一上传密码再次上传会覆盖原存档';

  // 随机生成密码的查重回调（只用于「随机生成密码」按钮；手动输入不查重）
  let pwdCheckCb = null, pwdCheckTarget = '';
  let genTries = 0;

  function refresh(){
    const upOk = validPwd($('pwd').value);
    const dlOk = validDlPwd($('dlpwd').value);
    // 上传按钮：依赖「上传密码」有效；下载按钮：依赖「取回密码」有效。二者互不影响。
    const can = state.dirValid && state.connOk && !state.busy;
    $('upload').disabled   = !(can && upOk);
    $('download').disabled = !(can && dlOk);
    $('detect').disabled   = state.busy;
    $('browse').disabled   = state.busy;
  }
  function setVerify(s,t){ const v=$('verify'); v.className='verify'+(s?(' '+s):''); v.textContent=t; refresh(); }
  function setHint(s,t){ const h=$('hint'); h.className='hint'+(s?(' '+s):''); h.textContent=t; }
  function setDlHint(s,t){ const h=$('dlhint'); h.className='hint'+(s?(' '+s):''); h.textContent=t; }
  function updatePwdHint(){
    const v = $('pwd').value;
    if(v === '') setHint(0, DEFAULT_HINT);
    else if(validPwd(v)) setHint(1, '✓ 密码格式有效（重复使用同一密码将覆盖原存档）');
    else setHint(2, '✗ 需 4~24 位字母或数字（不能含 SK- 前缀）');
  }
  function updateDlHint(){
    const v = $('dlpwd').value;
    if(v === '') setDlHint(0, '上传成功后，取回密码会显示在下方「操作结果」框；把它发给好友，对方即可取回你的存档');
    else if(validDlPwd(v)) setDlHint(1, '✓ 取回密码格式有效');
    else if(v.startsWith('SK')) setDlHint(2, '请输入完整的下载密码');   // 前提：前缀 SK- 正确，只是还没输满
    else setDlHint(2, '取回密码必须以SK-开头');                          // 非 SK- 开头统一提示
  }
  function setConn(s,t){ const c=$('conn'); c.className='conn '+s; $('connText').textContent=t; state.connOk=(s==='ok'); refresh(); }
  function setDir(path,vs,vt){ state.dir=path; state.dirValid=(vs===1); $('path').value=path; setVerify(vs===1?'ok':(vs===2?'err':''), vt); }

  // ---- 接收 native 推送 ----
  function onMessage(m){
    switch(m.type){
      // 注意：init 里不再携带、也绝不打印任何服务端地址（日志区对用户可见）
      case 'init':
        // 启动时若本机已记住密码，回填两个密码框并触发校验（不打印、不泄露）
        if (m.password) { $('pwd').value = m.password; $('pwd').dispatchEvent(new Event('input')); }
        if (m.downloadPassword) { $('dlpwd').value = m.downloadPassword; $('dlpwd').dispatchEvent(new Event('input')); }
        break;
      case 'log':   log(m.text); break;
      case 'progress':
        $('bar').style.width = (m.permille/10).toFixed(0) + '%';
        if(m.stage) $('stage').textContent = m.stage;
        break;
      case 'conn':  setConn(m.state===1?'ok':(m.state===2?'err':'wait'), m.text); break;
      case 'busy':  state.busy = !!m.busy; refresh(); break;
      case 'detectDone':
      case 'dir':   setDir(m.path||'', m.verifyState||0, m.verifyText||''); break;
      case 'done':  showDone(m); break;
      case 'icon':
        if(m.data){ const img=$('appIcon'); img.src='data:image/png;base64,'+m.data; img.style.display='block'; $('markText').style.display='none'; }
        break;
      case 'dlpwd':
        // 上传成功后 native 回填「取回密码」框：让上传者看到/复制自己的取回码，
        // 并随 input 事件写回 config（关闭时 DownloadPassword 不再为空）。
        if(m.value){ $('dlpwd').value = m.value; $('dlpwd').dispatchEvent(new Event('input')); }
        break;
      case 'passwordChecked':
        // 只处理「随机生成密码」的查重回调；手动输入密码不做任何拦截
        if(pwdCheckCb && m.password===pwdCheckTarget){ const cb=pwdCheckCb; pwdCheckCb=null; pwdCheckTarget=''; cb(!!m.exists); }
        break;
    }
  }

  function showDone(m){
    $('resLabel').textContent = m.resultLabel || '操作结果';
    // 每次新结果先清空旧文本，避免「复制结果」把多次操作的结果累加起来
    $('result').value = '';
    $('result').value = m.resultText || '';
    $('stage').textContent = m.stage || '就绪';
    $('stage').style.color = (!m.ok && !m.canceled) ? 'var(--warn)' : '';
    $('bar').style.width = (m.ok && !m.canceled) ? '100%' : '0%';
    $('copy').disabled = !m.copyEnabled;
    if(m.ok && !m.canceled){ state.dirValid = true; refresh(); }
  }

  // ---- 发送给 native（真实窗口）；浏览器直开时走模拟回退 ----
  function send(obj){
    if(inWebView) window.chrome.webview.postMessage(JSON.stringify(obj));
    else simulate(obj);
  }

  // 真实窗口：标题栏 / 装饰条拖拽
  function bindDrag(el){ if(!el) return; el.addEventListener('mousedown', e=>{
    if(e.button!==0) return; if(e.target.closest('button')) return;
    send({type:'drag'}); }); }
  bindDrag(document.querySelector('.titlebar'));
  bindDrag(document.querySelector('.accent'));
  document.querySelector('.winctrl button:not(.close)').onclick = ()=> send({type:'minimize'});
  document.querySelector('.winctrl .close').onclick = ()=> send({type:'close'});

  $('retry').onclick    = ()=> send({type:'health'});
  $('detect').onclick   = ()=> send({type:'detect'});
  $('browse').onclick   = ()=> send({type:'pick'});
  $('upload').onclick   = ()=> send({type:'upload', dir:state.dir, password:$('pwd').value});
  $('download').onclick = ()=> send({type:'download', dir:state.dir, dlpassword:$('dlpwd').value});
  $('copy').onclick     = ()=> send({type:'copy', text:$('result').value});

  // 显示 / 隐藏密码：改用 type=text + CSS -webkit-text-security 自遮罩，
  // 彻底规避 Edge/Chromium 对 type=password 自动叠加的「原生显示密码眼睛」
  // （那个原生控件 CSS 无法隐藏，会出现第二个眼、且功能与我们的切换重复）。
  // 遮罩用 CSS，明文切换走 .visible 类。
  // 显示 / 隐藏密码（上传框 / 取回框共用一套逻辑）
  function toggleEye(id, btnId){
    const el = $(id);
    const show = !el.classList.contains('visible');   // 当前遮罩态 → 即将显示明文
    el.classList.toggle('visible', show);
    $(btnId).classList.toggle('on', show);
    $(btnId).title = show ? '隐藏密码' : '显示密码';
    el.focus();
  }
  $('togglePwd').onclick    = ()=> toggleEye('pwd', 'togglePwd');
  $('toggleDlPwd').onclick = ()=> toggleEye('dlpwd', 'toggleDlPwd');

  // 复制当前密码
  $('copyPwd').onclick = ()=>{
    const v = $('pwd').value;
    if(!v){ setHint(2, '请先输入或生成密码再复制'); return; }
    send({type:'copy', text:v});
    log('密码已复制到剪贴板');
  };
  // 随机生成 20 位密码，并核对后端确保生成的是「未使用过」的密码
  $('genPwd').onclick = ()=>{ genTries = 0; genNext(); };

  function genRandomPwd(len){
    let s='';
    const buf = new Uint8Array(len);
    try { crypto.getRandomValues(buf); }
    catch(e){ for(let i=0;i<len;i++) buf[i] = Math.floor(Math.random()*256); }
    for(let i=0;i<len;i++) s += PWD_ALPHA[buf[i] % PWD_ALPHA.length];
    return s;
  }
  function dispatchInput(){ const el=$('pwd'); el.dispatchEvent(new Event('input')); }
  function genCheckPassword(p, cb){ pwdCheckCb=cb; pwdCheckTarget=p; send({type:'checkPassword', password:p}); }
  function genNext(){
    if(genTries >= 15){ const p = genRandomPwd(20); $('pwd').value=p; dispatchInput(); log('已生成 20 位随机密码（查重不可用，直接采用）'); return; }
    genTries++;
    const p = genRandomPwd(20);
    genCheckPassword(p, exists=>{ if(exists) genNext(); else { $('pwd').value=p; dispatchInput(); log('已生成 20 位随机密码（已核对：未使用过）'); } });
  }

  $('pwd').addEventListener('input', e=>{
    let v=e.target.value.replace(/[^A-Za-z0-9]/g,'').slice(0,24);
    // 上传密码框禁止以 SK- 开头（SK 是取回密码专用前缀）：清理掉开头的 SK / sk
    if(v.slice(0,2).toLowerCase()==='sk'){ v=v.slice(2); log('上传密码不能以 SK- 开头（SK 为取回密码专用）'); }
    e.target.value=v;
    // 每次变化都把当前密码回传 native，关闭时据此写入 uploader.ini（为空即写空）
    send({type:'password', password:v});
    updatePwdHint(); refresh();
  });
  $('dlpwd').addEventListener('input', e=>{
    // 取回密码框：仅允许字母数字与连字符，连字符只允许出现在第 3 位（SK- 形态）。
    // 关键修复：只有用户已输入 sk/SK 前缀时才做规范化；数字/其它字符绝不强行加前缀（避免误判 BUG）。
    let v=e.target.value.replace(/[^A-Za-z0-9-]/g,'').slice(0,23);
    if(v.length>=2 && v.slice(0,2).toLowerCase()==='sk'){
      v='SK'+v.slice(2);                                                  // 规范前缀大写
      if(v.length>=3 && v[2]!=='-') v='SK-'+v.slice(2).replace(/-/g,'');  // 第 3 位补连字符
      if(v.length>3) v=v.slice(0,3)+v.slice(3).replace(/-/g,'');          // 连字符只会出现在第 3 位
    } else {
      // 非 sk 前缀（如纯数字 / 只输入了单个 s）：不补全前缀，仅去掉误输入的连字符，交给下方提示「必须以 SK- 开头」
      v=v.replace(/-/g,'');
    }
    // 取回密码大小写不敏感由服务端 .upper() 比对保证，客户端不再强制转大写。
    // 否则输入框会被硬转成全大写，与结果框回填的真实 SK（混合大小写）割裂，
    // 让用户误以为"密码被改大小写"。保留原始大小写即可，服务端照常匹配。
    e.target.value=v;
    send({type:'dlpassword', dlpassword:v});
    updateDlHint(); refresh();
  });
  $('path').addEventListener('input', ()=>{ state.dir=''; state.dirValid=false; setVerify(0,'尚未选择目录'); });

  // 真实窗口里：目录只读（只能由“自动检测 / 手动选择”经 native 校验后填入）；
  // 同时切到 native 全铺满模式，去掉给浏览器预览用的外框留白 / 圆角 / 投影。
  if(inWebView){
    document.body.classList.add('native');
    $('path').readOnly = true;
    document.querySelector('.debug').style.display='none';
  }

  // ---- 预览模拟（浏览器直开时使用，方便设计预览）----
  let failNext=false;
  function simulate(obj){
    if(obj.type==='ready'){ onMessage({type:'init'});
      setTimeout(()=>send({type:'health'}),300); return; }
    if(obj.type==='health'){ setConn('wait','服务器连接：检测中…'); log('正在检测服务器连接...');
      setTimeout(()=>{ if(failNext){ setConn('err','× 服务器连接失败'); log('服务器连接失败'); }
        else{ setConn('ok','✓ 服务器连接成功'); log('服务器连接成功'); } },1000); return; }
    if(obj.type==='detect'){ log('开始检测 saves 目录…');
      setTimeout(()=>{ setDir('D:\\Games\\League of Legends\\saves',1,'校验通过，已找到 Hanbot 目录。');
        log('已找到：D:\\Games\\League of Legends\\saves'); },700); return; }
    if(obj.type==='pick'){ log('（预览）模拟选择目录');
      setTimeout(()=>{ setDir('D:\\Games\\League of Legends\\saves',1,'校验通过，已找到 Hanbot 目录。'); },400); return; }
    if(obj.type==='upload'||obj.type==='download'){
      const isDl = obj.type==='download'; state.busy=true; refresh();
      $('stage').textContent = isDl?'正在换取下载链接…':'正在加密打包…'; $('bar').style.width='10%';
      log('目标目录：'+obj.dir);
      let p=10; const t=setInterval(()=>{ p+=Math.floor(Math.random()*22)+8;
        if(p>=100){ p=100; clearInterval(t);
          const txt = isDl
            ? '已解压到： '+obj.dir+'\r\n恢复文件： 128 个\r\n下载大小： 4.21 MB\r\n解压大小： 18.6 MB\r\n取回密码： SK-'+genRandomPwd(20)
            : '密码：       '+obj.password+'\r\n压缩包大小： 2.34 MB（原始 9.8 MB，共 64 个文件）\r\n备份目录：   '+obj.dir+'\r\n完成时间：   2026-08-04 03:13';
          onMessage({type:'done', ok:true, canceled:false, isDownload:isDl, passwordWrong:false, error:'',
            resultText:txt, resultLabel:isDl?'下载结果':'上传结果（请保存密码）', stage:isDl?'下载解压完成':'上传完成', copyEnabled:true});
          state.busy=false; refresh();
        } else { $('bar').style.width = p+'%'; }
      },500); return; }
    if(obj.type==='copy'){ log('结果已复制到剪贴板（预览）'); return; }
    // minimize / close / maximize / drag：预览无窗口可控制，忽略
  }

  $('simConn').onclick = ()=>{ failNext=!failNext; send({type:'health'}); };
  $('simDir').onclick  = ()=> setDir('D:\\Games\\League of Legends\\saves',1,'校验通过，已找到 Hanbot 目录。');
  $('simClear').onclick= ()=> setDir('',0,'尚未选择目录');

  log('Hanbot缓存存储器 v1.0.0 已启动');
  if(inWebView){
    window.chrome.webview.addEventListener('message', e=>onMessage(JSON.parse(e.data)));
    send({type:'ready'});
  } else {
    simulate({type:'ready'});
  }
</script>
</body>
</html>
